<div class="register-container">
    <mat-card class="register-card">
        <mat-card-header>
            <mat-card-title>FinTrack</mat-card-title>
            <mat-card-subtitle>Create Your Account</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Name</mat-label>
                    <input matInput formControlName="name" placeholder="Enter your name" required/>
                    <mat-error *ngIf="registerForm.get('name')?.hasError('required')">
                        Name is required
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('name')?.hasError('minlength')">
                        Name must be at least 3 characters
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" placeholder="Enter your email" required/>
                    <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
                        Email is required
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
                        Email is invalid
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Password</mat-label>
                    <input matInput type="password" formControlName="password" placeholder="Enter your password" required/>
                    <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
                        Password is required
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
                        Password must be at least 6 characters
                    </mat-error>
                </mat-form-field>
                <button 
                    mat-raised-button
                    color="primary"
                    type="submit"
                    class="full-width"
                    [disabled]="registerForm.invalid || loading">
                    {{ loading ? 'Registering...' : 'Register' }}
                </button>
            </form>
        </mat-card-content>
        <mat-card-actions>
            <p>Already have an account? <a routerLink="/login">Login</a></p>
        </mat-card-actions>
    </mat-card>
</div>
