<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>FinTrack</mat-card-title>
            <mat-card-subtitle>Control Your Finances</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" type="email" placeholder="****@email.com"/>
                    <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
                    <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Email is invalid</mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Password</mat-label>
                    <input matInput formControlName="password" type="password"/>
                    <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
                    <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">Password must be at least 6 characters</mat-error>
                </mat-form-field>
                <button
                    mat-raised-button
                    color="primary"
                    type="submit"
                    class="full-width"
                    [disabled]="loginForm.invalid || loading">
                    {{ loading ? 'Logging in...' : 'Login' }}
                </button>
            </form>
        </mat-card-content>

        <mat-card-actions>
            <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
        </mat-card-actions>
    </mat-card>
</div>
